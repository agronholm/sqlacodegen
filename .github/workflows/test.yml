name: test suite

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }} / SQLAlchemy ${{ matrix.sqlalchemy }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        sqlalchemy: [">=2.0.29,<2.1", ">=2.1,<2.2"]
        exclude:
          # SQLAlchemy 2.1 requires Python 3.11 or later.
          - python-version: "3.10"
            sqlalchemy: ">=2.1,<2.2"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install dependencies
      run: pip install --group test -e .[sqlmodel,citext,geoalchemy2,pgvector] "SQLAlchemy${{ matrix.sqlalchemy }}"
    - name: Show dependency version
      run: python -c "import sqlalchemy; print(sqlalchemy.__version__)"
    - name: Test with pytest
      run: coverage run -m pytest
    - name: Upload Coverage
      uses: coverallsapp/github-action@v2
      with:
        parallel: true

  coveralls:
    name: Finish Coveralls
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Finished
      uses: coverallsapp/github-action@v2
      with:
        parallel-finished: true
